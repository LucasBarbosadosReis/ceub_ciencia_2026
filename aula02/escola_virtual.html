<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1>Escola Virtual</h1>
    <h2>Formulario de Pré-Matricula</h2>

<main>
   <fieldset>
        <h3>Dados Pessoais:</h3>
        <label for="Nome do Aluno">Nome do Aluno:</label>
        <input type="text">
        
        <label for="Nascimento">Nascimento (dd/mm/aaaa):</label>
        <input type="date">
        
        <label for="Nome da Mãe">Nome da Mãe:</label>
        <input type="text">
        
        <label for="Nome do Pai">Nome do Pai:</label>
        <input type="text">
        
        <label for="Telefone">Telefone:</label>
        <label for="DDD">DDD</label>
        <input type="number">
        <label for="Tel">Tel</label>
        <input type="number">
        <label for="Ramal">Ramal</label>
        <input type="number">
      
        <label for="E-mail">E-mail:</label>
        <input type="text">
   </fieldset>
   <fieldset>
    <h3>Informações de Matricula</h3>
    <label for="Serie">Serie:</label>
    <input type="number" nome= "pre-escolar"> 
    <label for="Turno">Turno:</label>
    <label for="Matutino">Manhã</label>
    <input type="checkbox">
    <label for="Matutino">Tarde</label>
    <input type="checkbox">
    <label for="Atividades">Atividades:</label>
    
    


   </fieldset>
</main>

    
</body>
</html>
